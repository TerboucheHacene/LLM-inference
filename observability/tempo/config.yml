# Minimal single-binary Tempo using local filesystem storage.
# Fine for a single-host dev/observability setup; not for production scale.
server:
  http_listen_port: 3200
  grpc_listen_port: 9097
  log_level: warn

# Accept traces over OTLP. Alloy's otlp exporter pushes to tempo:4317.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
