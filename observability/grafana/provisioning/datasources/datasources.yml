apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Fixed uid the provisioned vLLM dashboard binds to.
    uid: vllm-prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    # Fixed uid the provisioned vLLM Logs dashboard binds to.
    uid: vllm-loki
    url: http://loki:3100
    editable: false
    jsonData:
      # Turn the `trace_id=<hex>` printed in vLLM log lines (via the FastAPI +
      # logging OTel instrumentation) into a clickable link to the Tempo trace.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: 'trace_id=([0-9a-f]{32})'
          url: '$${__value.raw}'
          datasourceUid: vllm-tempo
          urlDisplayLabel: 'View trace'

  - name: Tempo
    type: tempo
    access: proxy
    uid: vllm-tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      # From any span, jump to the Loki logs for the same container around
      # the span's time. Correlates on time (no trace ID needed). Uses an
      # explicit query so it works regardless of span attribute mapping.
      tracesToLogsV2:
        datasourceUid: vllm-loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{container="vllm"}'
