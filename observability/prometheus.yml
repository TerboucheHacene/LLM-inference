# Prometheus scrape config for the vLLM OpenAI-compatible server.
# vLLM exposes metrics at /metrics by default; no serve flags are needed.
global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vllm
    # 'vllm' resolves over the compose network to the vLLM container.
    static_configs:
      - targets:
          - 'vllm:8000'

  # --- Infra exporters (15s is plenty; keeps series churn/load down) ---
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: dcgm
    scrape_interval: 15s
    static_configs:
      - targets: ['dcgm-exporter:9400']
